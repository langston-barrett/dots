[package]
name = "kludge"
description = "Random bits of code for automation"
version = "0.0.0"
edition = "2024"

[dependencies]
clap = { features = ["derive"], version = "4" }
tracing = "0.1"
tracing-subscriber = "0.3"

# https://nnethercote.github.io/perf-book/build-configuration.html
[profile.release]
codegen-units = 1
lto = "fat"
