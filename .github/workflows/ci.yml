name: CI
on:
  push:

defaults:
  run:
    shell: bash
    working-directory: ./kludge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Deps
      run: |
        rustup update
        rustup component add clippy
    - run: pip install mypy==v1.18.2
    - uses: astral-sh/ruff-action@v3
      with:
        args: "--version"
    - name: install typos
      run: |
        curl \
          --fail \
          --location \
          --proto '=https' \
          --show-error \
          --silent \
          --tlsv1.2 \
          https://github.com/crate-ci/typos/releases/download/v1.39.2/typos-v1.39.2-x86_64-unknown-linux-musl.tar.gz | \
          tar xzf - ./typos
        mkdir -p bin
        mv typos bin
        chmod +x bin/*
        printf "%s/bin" "${PWD}" >> "${GITHUB_PATH}"

    - uses: Swatinem/rust-cache@v2
    - run: cd .. && ./scripts/lint/lint.py
    - run: cargo test --locked --no-run
    - run: cargo test
    - run: cargo build --release
    - run: cargo run --release -- whitespace --check . ../files ../nixos ../scripts
