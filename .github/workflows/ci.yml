name: CI
on:
  push:

defaults:
  run:
    shell: bash
    working-directory: ./kludge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Deps
      run: |
        rustup update
        rustup component add clippy
    - uses: Swatinem/rust-cache@v2
    - uses: astral-sh/ruff-action@v3
      with:
        args: "--version"
    - run: cd .. && ./lint
    - run: cargo test --locked --no-run
    - run: cargo test
    - run: cargo build --release
    - run: cargo run --release -- whitespace --check . ../files ../nixos ../scripts
